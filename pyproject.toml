[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "payitgo"
version = "0.1.0"
description = "Python client for the payitgo crypto payment gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = []
keywords = ["payitgo", "payments", "crypto", "usdt", "bitcoin"]

[project.urls]
Repository = "https://github.com/thedivinez/payitgo-sdk/tree/main/python"

[tool.setuptools]
packages = ["payitgo"]
